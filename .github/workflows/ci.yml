name: Verify infrastructure

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: winwidget-infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify steady-state infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact infrastructure revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify shell syntax and static analysis
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null
          bash -n scripts/deploy-services-production.sh
          shellcheck -x scripts/deploy-services-production.sh
          sed -n "/<<'REMOTE_CONTROLLER'$/,/^REMOTE_CONTROLLER$/p" \
            scripts/deploy-services-production.sh | sed '1d;$d' | bash -n
          sed -n "/<<'REMOTE_CONTROLLER'$/,/^REMOTE_CONTROLLER$/p" \
            scripts/deploy-services-production.sh | sed '1d;$d' | \
            shellcheck -s bash -
          sed -n "/<<'FRONTEND_CONTROLLER'$/,/^FRONTEND_CONTROLLER$/p" \
            scripts/deploy-services-production.sh | sed '1d;$d' | bash -n
          sed -n "/<<'FRONTEND_CONTROLLER'$/,/^FRONTEND_CONTROLLER$/p" \
            scripts/deploy-services-production.sh | sed '1d;$d' | \
            shellcheck -s bash -

      - name: Verify workflow syntax and embedded shell
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            Dir[".github/workflows/*.yml"].sort.each do |path|
              YAML.load_file(path)
            end
          '
          ruby -e '
            require "yaml"
            workflow = YAML.load_file(".github/workflows/deploy-production.yml")
            puts workflow.fetch("jobs").fetch("deploy").fetch("steps").last.fetch("run")
          ' | bash -n
          ruby -e '
            require "yaml"
            workflow = YAML.load_file(".github/workflows/deploy-production.yml")
            puts workflow.fetch("jobs").fetch("deploy").fetch("steps").last.fetch("run")
          ' | shellcheck -s bash -

      - name: Verify exact production Docker cleanup contract
        shell: bash
        run: node scripts/test-production-docker-cleanup-contract.mjs

      - name: Verify steady-state-only contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const script = fs.readFileSync(
            'scripts/deploy-services-production.sh',
            'utf8'
          );
          const workflow = fs.readFileSync(
            '.github/workflows/deploy-production.yml',
            'utf8'
          );
          const readme = fs.readFileSync('README.md', 'utf8');
          const runbook = fs.readFileSync('docs/runbook.md', 'utf8');
          const backendNginx = fs.readFileSync('nginx/backend-api.conf', 'utf8');
          const frontendNginx = fs.readFileSync('nginx/frontend.conf', 'utf8');
          const telegramBridgeNginx = fs.readFileSync(
            'nginx/telegram-bridge/tg.winwidget.ru.conf',
            'utf8'
          );
          const telegramStreamNginx = fs.readFileSync(
            'nginx/telegram-bridge/telegram-api-stream.conf',
            'utf8'
          );
          const telegramBridgeReadme = fs.readFileSync(
            'nginx/telegram-bridge/README.md',
            'utf8'
          );

          const fail = message => {
            throw new Error(message);
          };
          const requireText = (source, value, message) => {
            if (!source.includes(value)) fail(message);
          };
          const rejectText = (source, value, message) => {
            if (source.includes(value)) fail(message);
          };

          const javascriptHeredocs = new Map();
          for (const label of [
            'MATERIALIZE_SERVICE_ENVS',
            'RESTORE_STORAGE_PROBE',
            'ENV_CONTRACT',
            'COMPOSE_CONTRACT',
            'NOTIFICATION_TOPOLOGY',
            'REPORTING_TOPOLOGY',
            'RABBITMQ_EXPECTED_USERS',
            'PROVISION_RABBITMQ',
            'VERIFY_OPERATIONS_DATABASE_BOUNDARY',
            'VERIFY_OPERATIONS_SERVICE_IDENTITY',
            'VERIFY_CURRENT_OPERATIONS_ROUTING',
            'VERIFY_CURRENT_REPORTING_ROUTING',
            'VERIFY_BACKUP_PROVENANCE_KEY',
            'VERIFY_OPERATIONS_WORKER_RUNTIME_IDENTITY',
            'VERIFY_DATABASE_RESTORE_ACTIVATION_IDLE',
            'VERIFY_TELEGRAM_PROXY_HEALTH'
          ]) {
            const pattern = new RegExp(
              `<<-?['"]?${label}['"]?[^\\n]*\\n([\\s\\S]*?)\\n${label}(?:\\n|$)`
            );
            const match = script.match(pattern);
            if (!match) fail(`missing JavaScript heredoc: ${label}`);
            try {
              new Function(match[1]);
            } catch {
              fail(`invalid JavaScript heredoc: ${label}`);
            }
            javascriptHeredocs.set(label, match[1]);
          }

          const serviceEnvMaterializer = javascriptHeredocs.get(
            'MATERIALIZE_SERVICE_ENVS'
          );
          const envContract = javascriptHeredocs.get('ENV_CONTRACT');
          const composeContract = javascriptHeredocs.get('COMPOSE_CONTRACT');
          const backupProvenanceKeyProbe = javascriptHeredocs.get(
            'VERIFY_BACKUP_PROVENANCE_KEY'
          );
          const operationsWorkerRuntimeIdentityProbe = javascriptHeredocs.get(
            'VERIFY_OPERATIONS_WORKER_RUNTIME_IDENTITY'
          );
          const databaseRestoreActivationIdleProbe = javascriptHeredocs.get(
            'VERIFY_DATABASE_RESTORE_ACTIVATION_IDLE'
          );
          const rabbitProvision =
            javascriptHeredocs.get('PROVISION_RABBITMQ');
          for (const key of [
            'DATABASE_RESTORE_RECEIPT_HMAC_KEY_BASE64',
            'DATABASE_RESTORE_RECEIPT_HMAC_KEY_ID'
          ]) {
            requireText(
              serviceEnvMaterializer,
              key,
              `restore receipt key materialization is missing: ${key}`
            );
            requireText(
              composeContract,
              key,
              `restore receipt Compose scope is missing: ${key}`
            );
          }
          for (const key of [
            'DATABASE_RESTORE_STAGING_DIR',
            'DATABASE_RESTORE_SEALED_DIR'
          ]) {
            requireText(
              serviceEnvMaterializer,
              key,
              `restore storage materialization is missing: ${key}`
            );
            requireText(
              composeContract,
              key,
              `restore storage Compose scope is missing: ${key}`
            );
          }
          requireText(
            composeContract,
            'DATABASE_RESTORE_ARTIFACT_RETENTION_HOURS',
            'restore artifact retention Compose contract is missing'
          );
          requireText(
            serviceEnvMaterializer,
            'decodedRestoreReceiptHmacKey.fill(0)',
            'decoded restore receipt key is not cleared after validation'
          );
          requireText(
            composeContract,
            "!['false', 'true'].includes(environment.DATABASE_RESTORE_ENABLED)",
            'restore gate is not restricted to literal true or false'
          );
          requireText(
            serviceEnvMaterializer,
            "['operations:DATABASE_RESTORE_ENABLED', 'false']",
            'restore gate materializer default is not fail-safe false'
          );
          requireText(
            composeContract,
            'apiEnvironment.DATABASE_RESTORE_ENABLED !==',
            'API and restore-worker kill switches are not bound together'
          );
          requireText(
            composeContract,
            'process.stdout.write(environment.DATABASE_RESTORE_ENABLED)',
            'validated restore gate is not returned to the deployment controller'
          );
          for (const evidence of [
            "{ status: { in: ['QUEUED', 'PROCESSING'] } },",
            "status: 'RECOVERY_REQUIRED',",
            'recoveryResolvedAt: null',
            "in: ['PENDING_APPROVAL', 'APPROVED', 'CONSUMED']",
            "status: { notIn: ['RESOLVED', 'EXPIRED'] }",
            'operations.database-restore.requested.v1',
            'operations.database-restore.recovery-action.requested.v1',
            "client.databaseRestoreExecutionLease.findUnique({"
          ]) {
            requireText(
              databaseRestoreActivationIdleProbe,
              evidence,
              `restore=true DB idle gate is missing: ${evidence}`
            );
          }
          for (const evidence of [
            'winwidget.operations.database-restore.v1',
            'winwidget.operations.database-restore.v1.retry-v1',
            'messages_ready messages_unacknowledged'
          ]) {
            requireText(
              script,
              evidence,
              `restore=true RabbitMQ idle gate is missing: ${evidence}`
            );
          }
          const restoreIdleCall = '\nverify_database_restore_activation_is_idle\n';
          const firstRestoreIdleCall = script.indexOf(restoreIdleCall);
          const rabbitProvisionStart = script.indexOf("<<'PROVISION_RABBITMQ'");
          if (
            firstRestoreIdleCall < 0 ||
            rabbitProvisionStart <= firstRestoreIdleCall
          ) {
            fail('restore=true idle gate must precede production provisioning');
          }
          const runtimeWithoutGatewayStart = script.indexOf(
            'compose_all up -d --no-build --force-recreate "${runtime_without_gateway[@]}"'
          );
          const restoreWorkerRolloutStart = script.indexOf(
            'compose_all up -d --no-build --force-recreate operations-restore-worker'
          );
          const secondRestoreIdleCall = script.indexOf(
            restoreIdleCall,
            runtimeWithoutGatewayStart
          );
          if (
            runtimeWithoutGatewayStart < 0 ||
            secondRestoreIdleCall <= runtimeWithoutGatewayStart ||
            secondRestoreIdleCall >= restoreWorkerRolloutStart
          ) {
            fail('restore=true idle gate must repeat immediately before worker rollout');
          }
          requireText(
            composeContract,
            "restoreWorker.labels?.['com.winwidget.singleton'] !== 'true'",
            'restore-worker singleton label is not validated'
          );
          requireText(
            composeContract,
            'restoreWorker.deploy?.replicas !== 1',
            'restore-worker single replica is not validated'
          );
          requireText(
            composeContract,
            "Object.hasOwn(services[name], 'user')",
            'non-worker Operations roles may override the image non-root identity'
          );
          requireText(
            script,
            'verify_singleton_running_service operations-restore-worker',
            'restore-worker runtime singleton count is not verified'
          );
          requireText(
            composeContract,
            "name === 'operations-api' || name === 'operations-restore-worker'",
            'restore receipt signing key is not restricted to the exact runtimes'
          );
          for (const key of [
            'DATABASE_BACKUP_PROVENANCE_KEY_ID',
            'DATABASE_BACKUP_PROVENANCE_PRIVATE_KEY_FILE'
          ]) {
            requireText(
              serviceEnvMaterializer,
              key,
              `backup provenance materialization is missing: ${key}`
            );
            requireText(
              composeContract,
              key,
              `backup provenance Compose scope is missing: ${key}`
            );
          }
          const fixedBackupProvenanceKeyPath =
            '/opt/winwidget/deploy/backend/.database-backup-provenance-private-key.pem';
          for (const [name, source] of [
            ['controller', script],
            ['Compose contract', composeContract],
            ['README', readme],
            ['runbook', runbook]
          ]) {
            requireText(
              source,
              fixedBackupProvenanceKeyPath,
              `${name} does not enforce the fixed backup provenance key path`
            );
          }
          const fixedBackupProvenanceKeyId =
            'operations-backup-ed25519-2026-08-31';
          for (const [name, source] of [
            ['service env materializer', serviceEnvMaterializer],
            ['Compose contract', composeContract],
            ['README', readme],
            ['runbook', runbook]
          ]) {
            requireText(
              source,
              fixedBackupProvenanceKeyId,
              `${name} does not pin the immutable backup provenance key ID`
            );
          }
          for (const rootEnvKey of [
            'DATABASE_BACKUP_PROVENANCE_KEY_ID',
            'DATABASE_BACKUP_PROVENANCE_PRIVATE_KEY_HOST_FILE'
          ]) {
            requireText(
              serviceEnvMaterializer,
              rootEnvKey,
              `service env materializer does not reject mutable root env input: ${rootEnvKey}`
            );
            requireText(
              envContract,
              rootEnvKey,
              `production env contract does not reject immutable release input: ${rootEnvKey}`
            );
          }
          requireText(
            serviceEnvMaterializer,
            'immutableBackupProvenanceRootEnvKeys.some(key => canonical.has(key))',
            'materializer accepts backup provenance configuration from root env'
          );
          requireText(
            envContract,
            'immutableBackupProvenanceRootEnvKeys.some(key => values.has(key))',
            'production env accepts immutable backup provenance release inputs'
          );
          requireText(
            script,
            "stat -c '%u:%g:%a:%h' \"$backup_provenance_private_key_file\"",
            'backup provenance host key metadata gate is missing'
          );
          requireText(
            script,
            'Backup provenance private key changed during deployment.',
            'backup provenance host key stability gate is missing'
          );
          requireText(
            script,
            'git -C "$release_root" ls-files --error-unmatch',
            'tracked public keyring gate is missing'
          );
          requireText(
            composeContract,
            "secret.source === 'database-backup-provenance-private-key'",
            'backup provenance secret scope gate is missing'
          );
          for (const evidence of [
            'backupProvenanceSecretNames',
            'expectedTopLevelSecrets',
            'sourceSecret?.file === backupProvenancePrivateKeyHostFile',
            'isPathEqualOrAncestor(',
            'mount.source,',
            'mount.target,'
          ]) {
            requireText(
              composeContract,
              evidence,
              `backup provenance secret-alias gate is missing: ${evidence}`
            );
          }
          for (const evidence of [
            'database-backup-provenance-private-key-source',
            '/run/winwidget-operations-secrets/database-backup-provenance-private-key.pem',
            "operationsWorker.user !== '0:0'",
            '/run/winwidget-operations-secrets:size=64k,mode=0700,uid=0,gid=0,noexec,nosuid,nodev',
            "Object.hasOwn(operationsWorker, 'init')",
            "operationsWorker.read_only !== true",
            "JSON.stringify(['CHOWN', 'SETGID', 'SETUID'].sort())"
          ]) {
            requireText(
              composeContract,
              evidence,
              `backup provenance copy/drop contract is missing: ${evidence}`
            );
          }
          requireText(
            backupProvenanceKeyProbe,
            'process.getuid?.() !== 1001',
            'backup provenance key probe does not preserve the worker UID boundary'
          );
          requireText(
            backupProvenanceKeyProbe,
            'process.pid !== 1',
            'backup provenance key probe does not require non-root PID 1'
          );
          for (const evidence of [
            "statusValue('Groups') !== '1001'",
            "statusValue('NoNewPrivs') !== '1'",
            "['CapInh', 'CapPrm', 'CapEff', 'CapAmb']",
            'runtimeKeyDirectoryStat.uid !== 0',
            'runtimeKeyDirectoryStat.gid !== 1001',
            '(runtimeKeyDirectoryStat.mode & 0o777) !== 0o710'
          ]) {
            requireText(
              backupProvenanceKeyProbe,
              evidence,
              `backup provenance privilege-drop probe is missing: ${evidence}`
            );
          }
          requireText(
            backupProvenanceKeyProbe,
            'timingSafeEqual(actualPublicKey, expectedPublicKeyDer)',
            'backup provenance key probe does not bind the private/public pair'
          );
          requireText(
            backupProvenanceKeyProbe,
            "error?.code !== 'EACCES'",
            'unprivileged worker can still read the root-only provenance source'
          );
          requireText(
            script,
            '["/usr/local/bin/operations-entrypoint.sh"]',
            'Operations image entrypoint identity gate is missing'
          );
          for (const evidence of [
            "fs.readFileSync('/proc/1/status', 'utf8')",
            "processName !== 'node'",
            "uidValues.every(value => value === '1001')",
            "gidValues.every(value => value === '1001')",
            "statusValue('Groups') !== '1001'",
            "statusValue('NoNewPrivs') !== '1'",
            "['CapInh', 'CapPrm', 'CapEff', 'CapAmb']",
            'runtimeKeyDirectoryStat.uid !== 0',
            'runtimeKeyDirectoryStat.gid !== 1001',
            '(runtimeKeyDirectoryStat.mode & 0o777) !== 0o710',
            '/run/winwidget-operations-secrets/database-backup-provenance-private-key.pem',
            "error?.code !== 'EACCES'"
          ]) {
            requireText(
              operationsWorkerRuntimeIdentityProbe,
              evidence,
              `deployed Operations worker identity gate is missing: ${evidence}`
            );
          }
          requireText(
            script,
            'docker exec --user 1001:1001 --interactive "$container_id" node -',
            'deployed Operations worker is not inspected as its runtime UID/GID'
          );
          const backupProvenanceProbeStart = script.indexOf(
            "<<'VERIFY_BACKUP_PROVENANCE_KEY'"
          );
          const infrastructureMutationStart = script.indexOf(
            'compose_all up -d --no-build "${infrastructure_services[@]}"'
          );
          if (
            backupProvenanceProbeStart < 0 ||
            infrastructureMutationStart <= backupProvenanceProbeStart
          ) {
            fail('backup provenance key probe must precede production mutations');
          }
          const operationsWorkerRolloutStart = script.indexOf(
            'compose_all up -d --no-build --force-recreate api-gateway'
          );
          const operationsWorkerRuntimeIdentityCall = script.indexOf(
            '\nverify_operations_worker_runtime_identity\n',
            operationsWorkerRolloutStart
          );
          if (
            operationsWorkerRolloutStart < 0 ||
            operationsWorkerRuntimeIdentityCall <= operationsWorkerRolloutStart
          ) {
            fail('deployed Operations worker PID 1 must be verified after rollout');
          }
          requireText(
            script,
            '\tverify_operations_worker_runtime_identity\n',
            'steady-state verification omits the Operations worker PID 1 gate'
          );
          requireText(
            script,
            "stat -c '%d:%i' \"$operations_restore_staging\"",
            'restore staging/sealed host inode alias guard is missing'
          );
          requireText(
            rabbitProvision,
            String.raw`write: '^winwidget\\.retry$'`,
            'restore-worker retry exchange write permission is missing'
          );
          requireText(
            rabbitProvision,
            'const retryKey = `${routingKey}.retry.v1`;',
            'restore retry TTL routing contract is missing'
          );
          for (const evidence of [
            'изолированном PostgreSQL 18',
            'literal `true` или `false`',
            'Безопасный default `.env.example` — `false`',
            'writer-fence evidence',
            'worker-only sealed storage',
            'transport retries не имеют terminal cap',
            'DATABASE_RESTORE_RECEIPT_HMAC_KEY_BASE64',
            'Ротация Ed25519 backup provenance',
            'Operations self-restore и Billing отсутствуют'
          ]) {
            requireText(
              runbook,
              evidence,
              `recovery runbook evidence is missing: ${evidence}`
            );
          }

          for (const retired of [
            'DEPLOY_MODE',
            'OPERATIONS_SNAPSHOT_SHA256',
            'OPERATIONS_CONTROL_PLANE_SNAPSHOT_SHA256',
            'controller_mode=',
            'deploy_mode=',
            'run_operations_cli()',
            'run_operations_cli_with_file()',
            'recover_failed_reporting_terminal_migration()',
            'stop_project_service_if_present()',
            'dist/src/cutover/',
            'control-plane-bootstrap.js',
            'operations.snapshot.json',
            'operations-control-plane.snapshot.json'
          ]) {
            rejectText(script, retired, `retired controller token: ${retired}`);
            rejectText(workflow, retired, `retired workflow token: ${retired}`);
            rejectText(readme, retired, `retired README token: ${retired}`);
            rejectText(runbook, retired, `retired runbook token: ${retired}`);
          }
          for (const retiredRuntimeDependency of [
            '/health/ownership',
            'ownership_generation',
            'ownershipGeneration',
            'source_database_id',
            'sourceDatabaseId',
            'source_revision',
            'sourceRevision',
            'source_sha256',
            'sourceSha256'
          ]) {
            rejectText(
              script,
              retiredRuntimeDependency,
              `retired runtime dependency: ${retiredRuntimeDependency}`
            );
          }
          if (/\b(?:ownership|cutover)[_-]?phase\b/i.test(script)) {
            fail('routine controller must not depend on an ownership phase');
          }
          if (/\bdocker\s+(?:rm|volume\s+rm)\b/.test(script)) {
            fail('routine controller contains a broad Docker removal');
          }
          if (/\brm\s+-rf\b/.test(script) || script.includes('.deleteQueue(')) {
            fail('routine controller contains a broad or queue deletion');
          }

          requireText(
            script,
            'verify_steady_state_phase()',
            'phased steady-state verifier is missing'
          );
          for (const evidence of [
            'verify_operations_database_boundary()',
            'verify_operations_service_identity()',
            'verify_current_reporting_routing_projection()',
            'verify_exact_project_container_inventory()',
            'verify_current_rabbitmq_user_inventory()',
            "identityRows[0].databaseName !== 'winwidget_operations'",
            "identityRows[0].databaseUser !== 'winwidget_operations_runtime'",
            "identityRows[0].schemaName !== 'operations'",
            "rows[0].serviceName !== 'operations-service'",
            'Live running Compose service inventory differs from the exact manifest contract',
            'cleanup_obsolete_winwidget_docker_resources()',
            'verify_steady_state_phase pre_cleanup',
            'verify_steady_state_phase post_cleanup',
            'verify_project_has_no_stopped_containers',
            'Running Docker container set changed before exact image removal',
            'Running Docker container set changed after exact image removal',
            'docker image rm --no-prune -- "$image_reference"',
            'Running Docker container set changed during exact Docker cleanup',
            'Docker container image bindings changed after image cleanup',
            'An unused tagged WinWidget image remains after exact cleanup',
            'Legacy RabbitMQ queue remains in steady state',
            'Legacy RabbitMQ user remains in steady state',
            'Temporary Core PostgreSQL container remains in steady state',
            'Temporary Core PostgreSQL volume remains in steady state',
            'A listener remains on the retired Core port 4200',
            'A retired Core public route remains reachable through backend Nginx'
          ]) {
            requireText(script, evidence, `steady-state evidence is missing: ${evidence}`);
          }

          const databaseBoundaryStart = script.indexOf(
            'verify_operations_database_boundary()'
          );
          const infrastructureStart = script.indexOf(
            'compose_all up -d --no-build "${infrastructure_services[@]}"'
          );
          if (
            databaseBoundaryStart < 0 ||
            infrastructureStart <= databaseBoundaryStart
          ) {
            fail('Operations database boundary verifier is misplaced');
          }
          const databaseBoundary = script.slice(
            databaseBoundaryStart,
            infrastructureStart
          );
          const steadyStart = script.indexOf('verify_steady_state_phase()');
          const convergenceStart = script.indexOf(
            'verify_current_reporting_routing_projection()'
          );
          if (convergenceStart < 0 || steadyStart <= convergenceStart) {
            fail('current control-plane verifier boundary is invalid');
          }
          const convergence = script.slice(convergenceStart, steadyStart);
          const serviceIdentityStart = script.indexOf(
            'verify_operations_service_identity()'
          );
          const serviceIdentityCall = script.indexOf(
            '\nverify_operations_service_identity\n'
          );
          if (
            serviceIdentityStart < 0 ||
            serviceIdentityCall <= serviceIdentityStart ||
            convergenceStart <= serviceIdentityCall
          ) {
            fail('Operations service identity verifier boundary is invalid');
          }
          const serviceIdentity = script.slice(
            serviceIdentityStart,
            serviceIdentityCall
          );
          for (const [name, verifier] of [
            ['Operations database boundary', databaseBoundary],
            ['Operations service identity', serviceIdentity],
            ['current routing projection', convergence]
          ]) {
            if (
              /\.(?:create|createMany|update|updateMany|upsert|delete|deleteMany|executeRaw|queryRawUnsafe)\b/.test(
                verifier
              ) ||
              /method:\s*['"](?:POST|PUT|PATCH|DELETE)['"]/.test(verifier)
            ) {
              fail(`${name} verifier is not read-only`);
            }
          }
          const databasePreflightCall = script.indexOf(
            '\nverify_operations_database_boundary\n'
          );
          const containerPreflightCall = script.indexOf(
            '\nverify_exact_project_container_inventory\n'
          );
          const rabbitPreflightCall = script.indexOf(
            '\nverify_current_rabbitmq_user_inventory\n'
          );
          const provisioningStart = script.indexOf("<<'PROVISION_RABBITMQ'");
          const migrationsStart = script.indexOf(
            'for migration_service in "${migration_services[@]}"; do'
          );
          const runtimeRolloutStart = script.indexOf(
            'compose_all up -d --no-build --force-recreate "${runtime_without_gateway[@]}"'
          );
          if (
            databasePreflightCall < infrastructureStart ||
            containerPreflightCall < infrastructureStart ||
            rabbitPreflightCall < infrastructureStart ||
            provisioningStart <= databasePreflightCall ||
            provisioningStart <= containerPreflightCall ||
            provisioningStart <= rabbitPreflightCall ||
            migrationsStart <= provisioningStart ||
            serviceIdentityCall <= migrationsStart ||
            runtimeRolloutStart <= serviceIdentityCall
          ) {
            fail('steady-state preflight or post-migration identity order is invalid');
          }
          const cleanupCall = script.indexOf(
            '\ncleanup_obsolete_winwidget_docker_resources\n'
          );
          const preCleanupSteadyStateCall = script.lastIndexOf(
            '\nverify_steady_state_phase pre_cleanup\n',
            cleanupCall
          );
