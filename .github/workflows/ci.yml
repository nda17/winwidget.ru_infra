          for (const evidence of [
            '`POST /api/v1/payments/webhook`',
            'по `$remote_addr`',
            'https://yookassa.ru/developers/using-api/webhooks'
          ]) {
            requireText(runbook, evidence, `runbook contract is missing: ${evidence}`);
          }

          process.stdout.write('steady_state_contracts=PASS\n');
          NODE

      - name: Verify rejected legacy CLI forms
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/deploy-services-production.sh'
          run_negative() {
            local name="$1"
            local expected_status="$2"
            local expected_pattern="$3"
            local output task_status
            shift 3
            set +e
            output="$(env -i PATH="$PATH" HOME="${HOME:-/tmp}" \
              bash "$script" "$@" 2>&1)"
            task_status=$?
            set -e
            if [[ "$task_status" != "$expected_status" ||
              ! "$output" =~ $expected_pattern ]]; then
              printf 'Negative CLI check failed: %s\n' "$name" >&2
              return 1
            fi
          }
          run_negative no_args 2 'Usage:'
          run_negative old_deploy_flag 1 'Services revision must be' --deploy
          run_negative old_cutover_flag 1 'Services revision must be' --cutover
          run_negative extra_argument 2 'Usage:' \
            0000000000000000000000000000000000000000 extra
          run_negative uppercase_revision 1 'Services revision must be' \
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          run_negative missing_infra_revision 1 'Infra revision must be' \
            0000000000000000000000000000000000000000

      - name: Verify tracked tree formatting
        shell: bash
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD -- .
