name: Deploy production services

on:
  workflow_call:
    inputs:
      services_revision:
        description: Immutable lowercase 40-hex winwidget.ru_services commit
        required: true
        type: string
    secrets:
      BACKEND_PRODUCTION_SSH_HOST:
        required: true
      BACKEND_PRODUCTION_SSH_PORT:
        required: true
      BACKEND_PRODUCTION_SSH_USER:
        required: true
      BACKEND_PRODUCTION_SSH_PRIVATE_KEY:
        required: true
      BACKEND_PRODUCTION_SSH_KNOWN_HOSTS:
        required: true
      BACKEND_PRODUCTION_ENV_SHA256:
        required: true
      FRONTEND_PRODUCTION_SSH_HOST:
        required: false
      FRONTEND_PRODUCTION_SSH_PORT:
        required: false
      FRONTEND_PRODUCTION_SSH_USER:
        required: false
      FRONTEND_PRODUCTION_SSH_PRIVATE_KEY:
        required: false
      FRONTEND_PRODUCTION_SSH_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

concurrency:
  group: winwidget-production-services
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable services revision
    if: >-
      github.repository == 'nda17/winwidget.ru_services' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/prod' &&
      inputs.services_revision == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out infrastructure controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable release identities
        shell: bash
        env:
          CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          CONTROLLER_REVISION: ${{ job.workflow_sha }}
          SERVICES_REVISION: ${{ inputs.services_revision }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_REPOSITORY" == 'nda17/winwidget.ru_infra' ]]
          [[ "$CONTROLLER_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVICES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONTROLLER_REVISION"

      - name: Deploy through pinned SSH transport
        shell: bash
        env:
          INFRA_REVISION: ${{ job.workflow_sha }}
          SERVICES_REVISION: ${{ inputs.services_revision }}
          PRODUCTION_SSH_HOST: ${{ secrets.BACKEND_PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.BACKEND_PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.BACKEND_PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.BACKEND_PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_PRODUCTION_SSH_KNOWN_HOSTS }}
          FRONTEND_PRODUCTION_SSH_HOST: ${{ secrets.FRONTEND_PRODUCTION_SSH_HOST }}
          FRONTEND_PRODUCTION_SSH_PORT: ${{ secrets.FRONTEND_PRODUCTION_SSH_PORT }}
          FRONTEND_PRODUCTION_SSH_USER: ${{ secrets.FRONTEND_PRODUCTION_SSH_USER }}
          FRONTEND_PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.FRONTEND_PRODUCTION_SSH_PRIVATE_KEY }}
          FRONTEND_PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.FRONTEND_PRODUCTION_SSH_KNOWN_HOSTS }}
          EXPECTED_PRODUCTION_ENV_SHA256: ${{ secrets.BACKEND_PRODUCTION_ENV_SHA256 }}
        run: |
          set -euo pipefail
          umask 077

          required_values=(
            PRODUCTION_SSH_HOST
            PRODUCTION_SSH_PORT
            PRODUCTION_SSH_USER
            PRODUCTION_SSH_PRIVATE_KEY
            PRODUCTION_SSH_KNOWN_HOSTS
            EXPECTED_PRODUCTION_ENV_SHA256
          )
          for variable_name in "${required_values[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Required production secret is missing: $variable_name" >&2
              exit 1
            fi
          done

          frontend_values=(
            FRONTEND_PRODUCTION_SSH_HOST
            FRONTEND_PRODUCTION_SSH_PORT
            FRONTEND_PRODUCTION_SSH_USER
            FRONTEND_PRODUCTION_SSH_PRIVATE_KEY
            FRONTEND_PRODUCTION_SSH_KNOWN_HOSTS
          )
          frontend_value_count=0
          for variable_name in "${frontend_values[@]}"; do
            if [[ -n "${!variable_name:-}" ]]; then
              frontend_value_count=$((frontend_value_count + 1))
            fi
          done
          if ((frontend_value_count != 0 && frontend_value_count != ${#frontend_values[@]})); then
            echo 'Frontend production SSH secrets must be configured as one complete group.' >&2
            exit 1
          fi

          credential_directory="$RUNNER_TEMP/winwidget-production-ssh"
          identity_file="$credential_directory/id_ed25519"
          known_hosts_file="$credential_directory/known_hosts"
          frontend_identity_file="$credential_directory/frontend_id_ed25519"
          frontend_known_hosts_file="$credential_directory/frontend_known_hosts"
          install -m 700 -d "$credential_directory"
          trap 'find "$credential_directory" -type f -delete; rmdir "$credential_directory"' EXIT

          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" >"$identity_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" >"$known_hosts_file"
          chmod 600 "$identity_file" "$known_hosts_file"

          export PRODUCTION_SSH_IDENTITY_FILE="$identity_file"
          export PRODUCTION_SSH_KNOWN_HOSTS_FILE="$known_hosts_file"
          if ((frontend_value_count == ${#frontend_values[@]})); then
            printf '%s\n' "$FRONTEND_PRODUCTION_SSH_PRIVATE_KEY" >"$frontend_identity_file"
            printf '%s\n' "$FRONTEND_PRODUCTION_SSH_KNOWN_HOSTS" >"$frontend_known_hosts_file"
            chmod 600 "$frontend_identity_file" "$frontend_known_hosts_file"
            export FRONTEND_PRODUCTION_SSH_IDENTITY_FILE="$frontend_identity_file"
            export FRONTEND_PRODUCTION_SSH_KNOWN_HOSTS_FILE="$frontend_known_hosts_file"
          fi

          bash scripts/deploy-services-production.sh "$SERVICES_REVISION"
