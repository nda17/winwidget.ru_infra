upstream winwidget_gateway {
	server 127.0.0.1:4100;
	keepalive 32;
}

upstream winwidget_widgets {
	server 127.0.0.1:4700;
	keepalive 32;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	listen [::]:80;
	server_name api.winwidget.ru;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name api.winwidget.ru;

	ssl_certificate /etc/letsencrypt/live/api.winwidget.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/api.winwidget.ru/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 20m;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location = /api/v1/payments/webhook {
		limit_except POST {
			deny all;
		}

		allow 185.71.76.0/27;
		allow 185.71.77.0/27;
		allow 77.75.153.0/25;
		allow 77.75.156.11;
		allow 77.75.156.35;
		allow 77.75.154.128/25;
		allow 2a02:5180::/32;
		deny all;

		client_max_body_size 256k;
		client_body_timeout 10s;
		proxy_pass http://winwidget_gateway;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-User-Id "";
		proxy_set_header X-User-Roles "";
		proxy_set_header X-User-Session-Id "";
		proxy_set_header X-Auth-User-Id "";
		proxy_set_header X-Auth-Roles "";
		proxy_set_header X-Auth-Session-Id "";
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 3s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location ~* ^/api/v1/payments/webhook {
		return 404;
	}

	location = /api/v1/telegram-auth/webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass http://winwidget_gateway;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-User-Id "";
		proxy_set_header X-User-Roles "";
		proxy_set_header X-User-Session-Id "";
		proxy_set_header X-Auth-User-Id "";
		proxy_set_header X-Auth-Roles "";
		proxy_set_header X-Auth-Session-Id "";
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 3s;
		proxy_read_timeout 10s;
		proxy_send_timeout 10s;
	}

	location = /api/v1/telegram-bot/webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass http://winwidget_gateway;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-User-Id "";
		proxy_set_header X-User-Roles "";
		proxy_set_header X-User-Session-Id "";
		proxy_set_header X-Auth-User-Id "";
		proxy_set_header X-Auth-Roles "";
		proxy_set_header X-Auth-Session-Id "";
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 3s;
		proxy_read_timeout 10s;
		proxy_send_timeout 10s;
	}

	location = /api/v1/telegram-bot/support-webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass http://winwidget_gateway;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-User-Id "";
		proxy_set_header X-User-Roles "";
		proxy_set_header X-User-Session-Id "";
		proxy_set_header X-Auth-User-Id "";
		proxy_set_header X-Auth-Roles "";
		proxy_set_header X-Auth-Session-Id "";
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 3s;
		proxy_read_timeout 10s;
		proxy_send_timeout 10s;
	}

	location = /api/v1 {
		proxy_pass http://winwidget_gateway;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-User-Id "";
		proxy_set_header X-User-Roles "";
		proxy_set_header X-User-Session-Id "";
		proxy_set_header X-Auth-User-Id "";
		proxy_set_header X-Auth-Roles "";
		proxy_set_header X-Auth-Session-Id "";
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_connect_timeout 3s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}

	# DEV-only asynchronous PostgreSQL restore upload. The worker performs the
	# destructive work after the API has durably staged and signed the job, so
	# this timeout covers only the bounded multipart upload, not pg_restore.
	location ~ ^/api/v1/dev-tools/database-restores(?:/|$) {
		client_max_body_size 50m;
		client_body_timeout 120s;

		proxy_pass http://winwidget_gateway;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-User-Id "";
		proxy_set_header X-User-Roles "";
		proxy_set_header X-User-Session-Id "";
		proxy_set_header X-Auth-User-Id "";
		proxy_set_header X-Auth-Roles "";
		proxy_set_header X-Auth-Session-Id "";
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 3s;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
	}

	location /api/v1/ {
		proxy_pass http://winwidget_gateway;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-User-Id "";
		proxy_set_header X-User-Roles "";
		proxy_set_header X-User-Session-Id "";
		proxy_set_header X-Auth-User-Id "";
		proxy_set_header X-Auth-Roles "";
		proxy_set_header X-Auth-Session-Id "";
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_connect_timeout 3s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}

	location /widgets/ {
		proxy_pass http://winwidget_widgets;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		return 404;
	}
}
