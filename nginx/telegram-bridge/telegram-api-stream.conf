stream {
	limit_conn_zone $binary_remote_addr zone=telegram_api_per_ip:10m;
	log_format telegram_api_stream
		'$remote_addr [$time_local] $protocol $status '
		'$bytes_sent $bytes_received $session_time';
	access_log /var/log/nginx/telegram-api-stream.access.log telegram_api_stream;
	error_log /var/log/nginx/telegram-api-stream.error.log warn;
	map $remote_addr $telegram_api_upstream {
		default api.telegram.org:443;
	}

	server {
		listen 8443;
		listen [::]:8443;

		# Resolve at connection time and deliberately ignore Telegram AAAA records:
		# this VPS has public IPv6 listeners but no working outbound IPv6 route.
		resolver 1.1.1.1 8.8.8.8 ipv6=off valid=5m;
		resolver_timeout 5s;
		proxy_pass $telegram_api_upstream;
		proxy_connect_timeout 10s;
		proxy_timeout 11m;
		proxy_socket_keepalive on;
		limit_conn telegram_api_per_ip 32;
	}
}
