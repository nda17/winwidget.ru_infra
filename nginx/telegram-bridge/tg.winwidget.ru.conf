upstream winwidget_api_origin {
	server api.winwidget.ru:443;
	keepalive 16;
}

limit_conn_zone $binary_remote_addr zone=telegram_api_https_per_ip:10m;

server {
	listen 80;
	listen [::]:80;
	server_name tg.winwidget.ru;

	location /telegram-api/ {
		# Never reflect or log a Bot API token received over plaintext HTTP.
		access_log off;
		error_log /dev/null;
		return 404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name tg.winwidget.ru;

	ssl_certificate /etc/letsencrypt/live/tg.winwidget.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/tg.winwidget.ru/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 1m;

	access_log /var/log/nginx/tg.winwidget.ru.access.log;
	error_log /var/log/nginx/tg.winwidget.ru.error.log warn;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# Verify both fixed HTTPS upstreams against the system CA bundle. Individual
	# locations still pin proxy_ssl_name to the exact upstream host.
	proxy_ssl_verify on;
	proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
	proxy_ssl_verify_depth 3;
	# The bridge has no working outbound IPv6 route. Resolve the fixed Telegram
	# origin at request time and deliberately ignore AAAA records.
	resolver 1.1.1.1 8.8.8.8 ipv6=off valid=5m;
	resolver_timeout 5s;
	set $telegram_api_origin_url https://api.telegram.org;

	location = /telegram-api-health {
		limit_except GET {
			deny all;
		}

		access_log off;
		error_log /var/log/nginx/telegram-api-proxy.error.log crit;
		add_header X-WinWidget-Telegram-Proxy "active" always;

		rewrite ^ / break;
		proxy_pass $telegram_api_origin_url;
		proxy_pass_request_body off;
		proxy_http_version 1.1;
		proxy_set_header Host api.telegram.org;
		proxy_set_header Connection "";
		proxy_set_header Content-Length "";
		proxy_ssl_server_name on;
		proxy_ssl_name api.telegram.org;
		proxy_ssl_verify on;
		proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
		proxy_ssl_verify_depth 3;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location ~ ^/telegram-api/(bot[0-9]+:[A-Za-z0-9_-]+)/(getMe|getWebhookInfo|deleteWebhook|setWebhook|sendMessage|sendDocument|getFile|copyMessage|answerCallbackQuery)$ {
		limit_except GET POST {
			deny all;
		}

		# The bot token is part of Telegram's URL. Never log this request path.
		access_log off;
		error_log /dev/null;
		client_max_body_size 52m;
		limit_conn telegram_api_https_per_ip 32;

		rewrite ^/telegram-api/(.*)$ /$1 break;
		proxy_pass $telegram_api_origin_url;
		proxy_http_version 1.1;
		proxy_set_header Host api.telegram.org;
		proxy_set_header Connection "";
		proxy_ssl_server_name on;
		proxy_ssl_name api.telegram.org;
		proxy_ssl_verify on;
		proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
		proxy_ssl_verify_depth 3;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 10s;
		proxy_read_timeout 11m;
		proxy_send_timeout 11m;
	}

	location ~ ^/telegram-api/file/(bot[0-9]+:[A-Za-z0-9_-]+)/(documents/file_[0-9]+(?:[.][A-Za-z0-9_-]+)?)$ {
		limit_except GET {
			deny all;
		}

		# The bot token is part of Telegram's URL. Never log this request path.
		access_log off;
		error_log /dev/null;
		limit_conn telegram_api_https_per_ip 32;

		rewrite ^/telegram-api/(.*)$ /$1 break;
		proxy_pass $telegram_api_origin_url;
		proxy_http_version 1.1;
		proxy_set_header Host api.telegram.org;
		proxy_set_header Connection "";
		proxy_ssl_server_name on;
		proxy_ssl_name api.telegram.org;
		proxy_ssl_verify on;
		proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
		proxy_ssl_verify_depth 3;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 10s;
		proxy_read_timeout 11m;
		proxy_send_timeout 11m;
	}

	location /telegram-api/ {
		access_log off;
		error_log /dev/null;
		return 404;
	}

	location = /api/v1/telegram-auth/webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location = /api/v1/telegram-bot/webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location = /api/v1/telegram-bot/support-webhook {
		limit_except POST {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location = /api/v1/telegram-bot/webhook-health {
		limit_except GET {
			deny all;
		}

		proxy_pass https://winwidget_api_origin;
		proxy_ssl_server_name on;
		proxy_ssl_name api.winwidget.ru;
		proxy_http_version 1.1;
		proxy_set_header Host api.winwidget.ru;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
	}

	location / {
		return 404;
	}
}
