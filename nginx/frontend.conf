upstream winwidget_landing {
	server 127.0.0.1:3000;
	keepalive 32;
}

upstream winwidget_crm {
	server 127.0.0.1:3001;
	keepalive 32;
}

upstream winwidget_widgets {
	server 127.0.0.1:3002;
	keepalive 32;
}

upstream winwidget_admin {
	server 127.0.0.1:3003;
	keepalive 32;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	listen [::]:80;
	server_name winwidget.ru www.winwidget.ru;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name winwidget.ru www.winwidget.ru;

	ssl_certificate /etc/letsencrypt/live/winwidget.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/winwidget.ru/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 20m;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_read_timeout 60s;
	proxy_send_timeout 60s;

	# Retain chunks from previous images for open tabs; no runtime fallback.
	location ^~ /_next/static/ {
		alias /opt/winwidget/deploy/frontend/assets/legacy/_next/static/;
		autoindex off;
		disable_symlinks on;
		expires 1y;
	}

	location ^~ /_frontends/landing/_next/static/ {
		alias /opt/winwidget/deploy/frontend/assets/landing/_next/static/;
		autoindex off;
		disable_symlinks on;
		expires 1y;
	}

	location ^~ /_frontends/widgets/_next/static/ {
		alias /opt/winwidget/deploy/frontend/assets/widgets/_next/static/;
		autoindex off;
		disable_symlinks on;
		expires 1y;
	}

	location ^~ /_frontends/admin-panel/_next/static/ {
		alias /opt/winwidget/deploy/frontend/assets/admin-panel/_next/static/;
		autoindex off;
		disable_symlinks on;
		expires 1y;
	}

	# Preserve URI/query for the app-local Next image optimizer and other assets.
	location ^~ /_frontends/landing/_next/ {
		proxy_pass http://winwidget_landing;
	}

	location ^~ /_frontends/widgets/_next/ {
		proxy_pass http://winwidget_widgets;
	}

	location ^~ /_frontends/admin-panel/_next/ {
		proxy_pass http://winwidget_admin;
	}

	location ^~ /_frontends/ {
		return 404;
	}

	location = /admin {
		proxy_pass http://winwidget_admin;
	}

	location ^~ /admin/ {
		proxy_pass http://winwidget_admin;
	}

	location ~ ^/(cabinet|payment|login|register|restore-password|social-auth|logout|wheels|quizzes|callbacks|timers|stop-offers|calculators|page-wheel|page-quiz|page-callback|page-timer|page-stop-offer|page-ai-consultant|page-calculator)(/|$) {
		proxy_pass http://winwidget_widgets;
	}

	location / {
		proxy_pass http://winwidget_landing;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name crm.winwidget.ru;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name crm.winwidget.ru;

	# Release gate: verify DNS and provision this certificate before installing.
	ssl_certificate /etc/letsencrypt/live/crm.winwidget.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/crm.winwidget.ru/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 20m;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_read_timeout 60s;
	proxy_send_timeout 60s;

	location ^~ /_next/static/ {
		alias /opt/winwidget/deploy/frontend/assets/crm/_next/static/;
		autoindex off;
		disable_symlinks on;
		expires 1y;
	}

	location / {
		proxy_pass http://winwidget_crm;
	}
}
